<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07091E">
  <!-- Prevents Browser/OS Forced Dark Mode & Auto-Contrast Grey Boxes -->
  <meta name="color-scheme" content="only dark">
  <meta name="supported-color-schemes" content="dark">
  <title>Peace AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* ==========================================================
       Peace AI — glass over a midnight bioluminescent ocean
       ========================================================== */
    :root {
      color-scheme: only dark;
      --cyan: #00E5FF;
      --lavender: #C77DFF;
      --navy: #07091E;
      --mist: #F0F4FF;

      --glass: rgba(7, 9, 30, 0.5);
      --glass-strong: rgba(7, 9, 30, 0.62);
      --line: rgba(240, 244, 255, 0.14);
      --line-cyan: rgba(0, 229, 255, 0.42);
      --mist-dim: rgba(240, 244, 255, 0.72);
      --mist-faint: rgba(240, 244, 255, 0.5);

      --font-head: 'Bricolage Grotesque', system-ui, sans-serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --ease: cubic-bezier(.22, .8, .24, 1);
    }

    /* ---------- Reset & Anti-Grey-Box Shield ---------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      -webkit-tap-highlight-color: transparent;
      forced-color-adjust: none !important;
      -ms-high-contrast-adjust: none !important;
    }

    html, body {
      height: 100%;
      overflow: hidden; /* Strict lock on body scroll */
      background: transparent !important;
      color: var(--mist);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, p, span, label, summary, div:not(.glass):not(.status):not(.msg):not(.bar):not(.scrim) {
      background-color: transparent !important;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: var(--navy) url('./bg.png') center / cover no-repeat;
    }

    button, input, textarea, summary {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      outline: 0;
      appearance: none;
      -webkit-appearance: none;
      border-radius: 0;
    }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }
    summary { list-style: none; cursor: pointer; }
    summary::-webkit-details-marker { display: none; }

    :is(button, summary, textarea, input):focus-visible {
      box-shadow: 0 0 0 2px rgba(0, 229, 255, 0.55), 0 0 22px rgba(0, 229, 255, 0.25);
    }
    .bar:focus-within {
      border-color: var(--line-cyan);
      box-shadow: 0 0 0 1px rgba(0, 229, 255, 0.25), 0 10px 40px rgba(0, 229, 255, 0.14);
    }
    .bar textarea:focus-visible { box-shadow: none; }

    input:-webkit-autofill,
    textarea:-webkit-autofill {
      -webkit-text-fill-color: var(--mist);
      transition: background-color 99999s ease-out;
      box-shadow: 0 0 0 1000px transparent inset;
    }

    /* ---------- Glass ---------- */
    .glass {
      background: var(--glass) !important;
      -webkit-backdrop-filter: blur(16px) saturate(140%);
      backdrop-filter: blur(16px) saturate(140%);
      border: 1px solid var(--line);
      box-shadow: 0 8px 40px rgba(2, 3, 20, 0.35), inset 0 1px 0 rgba(240, 244, 255, 0.06);
    }

    /* ---------- Orb ---------- */
    .orb {
      display: block;
      flex: none;
      width: var(--s, 40px);
      height: var(--s, 40px);
      border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, #F0F4FF 0%, #00E5FF 22%, #C77DFF 64%, rgba(90, 24, 154, 0.75) 100%) !important;
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.55), 0 0 70px rgba(199, 125, 255, 0.4);
    }
    .orb-sm { --s: 42px; }
    .orb-lg {
      --s: 112px;
      box-shadow: 0 0 40px rgba(0, 229, 255, 0.6), 0 0 120px rgba(199, 125, 255, 0.45);
      animation: breathe 7s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { transform: scale(0.94); filter: brightness(0.95); }
      50%      { transform: scale(1.08); filter: brightness(1.15); }
    }

    /* ---------- Layout ---------- */
    .app {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 16px;
      height: 100dvh;
      padding: 16px;
      overflow: hidden; /* Added to fix container stretching */
    }

    /* ---------- Sidebar ---------- */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 22px;
      border-radius: 28px;
      overflow-y: auto;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand-title {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: 1.45rem;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }
    .brand-sub { font-size: 0.82rem; color: var(--mist-dim); margin-top: 2px; }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      align-self: flex-start;
      padding: 7px 14px 7px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 500;
      background: rgba(240, 244, 255, 0.06) !important;
      border: 1px solid var(--line);
    }
    .status .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--lavender) !important;
      box-shadow: 0 0 10px var(--lavender);
    }
    .status[data-state="online"] .dot  { background: #3DF5A0 !important; box-shadow: 0 0 12px #3DF5A0, 0 0 3px #3DF5A0; }
    .status[data-state="offline"] .dot { background: #FF6B8A !important; box-shadow: 0 0 12px #FF6B8A; }
    .status[data-state="checking"] .dot { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.3; } }

    .new-chat {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 18px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 0.95rem;
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.16), rgba(199, 125, 255, 0.16)) !important;
      border: 1px solid var(--line-cyan);
      transition: transform .3s var(--ease), box-shadow .3s var(--ease), background .3s var(--ease);
    }
    .new-chat:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, rgba(0, 229, 255, 0.26), rgba(199, 125, 255, 0.26)) !important;
      box-shadow: 0 0 28px rgba(0, 229, 255, 0.22);
    }

    .settings { margin-top: auto; border-top: 1px solid var(--line); padding-top: 14px; }
    .settings summary {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 6px;
      border-radius: 12px;
      font-size: 0.92rem;
      color: var(--mist-dim);
      transition: color .25s;
    }
    .settings summary:hover { color: var(--mist); }
    .settings .chev { margin-left: auto; transition: transform .3s var(--ease); }
    .settings[open] .chev { transform: rotate(180deg); }
    .settings-body { display: grid; gap: 8px; padding: 10px 6px 4px; }
    .settings-body label { font-size: 0.8rem; color: var(--mist-dim); }
    .settings-body input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 0.85rem;
      background: rgba(240, 244, 255, 0.05) !important;
      border: 1px solid var(--line);
    }
    .settings-body input:focus { border-color: var(--line-cyan); }
    .hint { font-size: 0.75rem; color: var(--mist-faint); }

    /* ---------- Main (Strict layout constraints) ---------- */
    .main {
      position: relative;
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0; /* Added: Forces flex to respect parent height */
      height: 100%;
      overflow: hidden; /* Added: Stops flex children from blowing out container */
      background: transparent !important;
    }

    .stage {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 24px 12px 12px;
      display: flex;
      flex-direction: column;
      scrollbar-width: thin;
      scrollbar-color: rgba(240, 244, 255, 0.2) transparent;
      scroll-behavior: smooth; /* Added for smoother automated scrolling */
    }
    .stage::-webkit-scrollbar { width: 8px; }
    .stage::-webkit-scrollbar-track { background: transparent; }
    .stage::-webkit-scrollbar-thumb { background: rgba(240, 244, 255, 0.18); border-radius: 8px; }

    /* ---------- Hero ---------- */
    .hero {
      margin: auto;
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
      padding: 8px 0 24px;
    }
    .hero h1 {
      font-family: var(--font-head);
      font-weight: 700;
      font-size: clamp(2.3rem, 5.4vw, 3.8rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
      margin-top: 14px;
      text-shadow: 0 2px 30px rgba(7, 9, 30, 0.8), 0 0 40px rgba(0, 229, 255, 0.18);
    }
    .hero-sub {
      max-width: 46ch;
      font-size: clamp(1rem, 1.6vw, 1.12rem);
      color: var(--mist-dim);
      text-shadow: 0 1px 14px rgba(7, 9, 30, 0.9);
    }

    /* ---------- Starter prompts ---------- */
    .prompts {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 18px;
    }
    .prompt {
      text-align: left;
      padding: 16px 22px;
      border-radius: 22px;
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--mist);
      background: var(--glass) !important;
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      transition: transform .35s var(--ease), border-color .35s var(--ease), background .35s var(--ease), box-shadow .35s var(--ease);
    }
    .prompt:hover {
      transform: translateX(8px);
      border-color: var(--line-cyan);
      background: rgba(14, 18, 52, 0.62) !important;
      box-shadow: -6px 0 28px rgba(0, 229, 255, 0.18), 0 10px 30px rgba(2, 3, 20, 0.35);
    }
    .prompt:active { transform: translateX(4px) scale(0.99); }

    /* ---------- Chat feed ---------- */
    .feed {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 20px; /* Added breathing room at the bottom of messages */
    }
    .has-chat .hero { display: none; }
    .has-chat .stage { justify-content: flex-start; }

    .msg {
      max-width: min(680px, 88%);
      padding: 14px 20px;
      border-radius: 24px;
      white-space: pre-wrap;
      overflow-wrap: break-word; /* Better handling of long URLs without breaking layout */
      word-break: break-word; /* Ensure layout doesn't break horizontally */
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid var(--line);
      animation: arrive .45s var(--ease) both;
    }
    @keyframes arrive { from { opacity: 0; transform: translateY(10px); } }

    .msg.user {
      align-self: flex-end;
      border-bottom-right-radius: 8px;
      background: rgba(120, 60, 190, 0.34) !important;
      border-color: rgba(199, 125, 255, 0.4);
    }
    .msg.bot {
      align-self: flex-start;
      border-bottom-left-radius: 8px;
      background: var(--glass-strong) !important;
      border-color: rgba(0, 229, 255, 0.24);
      line-height: 1.6; /* Better readability for long AI answers */
    }
    .msg.error {
      border-color: rgba(255, 107, 138, 0.5);
      color: #FFD3DC;
    }

    /* Basic Markdown Styling inside AI messages */
    .msg.bot strong { color: #fff; font-weight: 600; }
    .msg.bot h3 { font-size: 1.1rem; color: #00E5FF; margin: 12px 0 6px 0; }
    .msg.bot ul { padding-left: 18px; margin: 8px 0; }
    .msg.bot li { margin-bottom: 4px; }

    .typing { display: inline-flex; gap: 6px; padding: 18px 20px; }
    .typing i {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--cyan) !important;
      box-shadow: 0 0 8px var(--cyan);
      animation: bounce 1.2s ease-in-out infinite;
    }
    .typing i:nth-child(2) { animation-delay: .15s; background: #8FB3FF !important; }
    .typing i:nth-child(3) { animation-delay: .3s; background: var(--lavender) !important; }
    @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-5px); opacity: 1; } }

    /* ---------- Composer (floats, no backing block) ---------- */
    .composer {
      flex: none;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      background: transparent !important;
      z-index: 10; /* Ensures it stays on top */
    }
    .bar {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 8px 8px 8px 24px;
      border-radius: 32px;
      transition: border-color .3s var(--ease), box-shadow .3s var(--ease);
    }
    .bar textarea {
      flex: 1;
      min-width: 0;
      max-height: 160px;
      padding: 10px 0;
      resize: none;
      font-size: 1rem;
      line-height: 1.5;
      background: transparent !important;
      color: var(--mist);
    }
    .bar textarea::placeholder { color: var(--mist-faint); }

    .send {
      flex: none;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: var(--navy);
      background: linear-gradient(135deg, var(--cyan), var(--lavender)) !important;
      box-shadow: 0 0 22px rgba(0, 229, 255, 0.35);
      transition: transform .3s var(--ease), box-shadow .3s var(--ease), opacity .3s;
    }
    .send:hover:not(:disabled) { transform: scale(1.08); box-shadow: 0 0 30px rgba(199, 125, 255, 0.55); }
    .send:disabled { opacity: 0.35; cursor: default; box-shadow: none; }

    /* ---------- Mobile drawer ---------- */
    .menu-btn, .scrim { display: none; }

    @media (max-width: 860px) {
      .app { grid-template-columns: minmax(0, 1fr); padding: 0; gap: 0; }

      .menu-btn {
        display: grid;
        place-items: center;
        position: fixed;
        top: calc(12px + env(safe-area-inset-top, 0px));
        left: 12px;
        z-index: 30;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: var(--glass) !important;
        -webkit-backdrop-filter: blur(16px);
        backdrop-filter: blur(16px);
        border: 1px solid var(--line);
      }

      .sidebar {
        position: fixed;
        top: 10px; bottom: 10px; left: 10px;
        z-index: 40;
        width: min(320px, calc(100vw - 20px));
        transform: translateX(calc(-100% - 20px));
        transition: transform .45s var(--ease);
      }
      .app.menu-open .sidebar { transform: none; }

      .scrim {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 35;
        background: rgba(7, 9, 30, 0.35) !important;
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
        opacity: 0;
        pointer-events: none;
        transition: opacity .35s;
      }
      .app.menu-open .scrim { opacity: 1; pointer-events: auto; }

      .stage { padding: 72px 16px 8px; }
      .composer { padding: 6px 12px calc(10px + env(safe-area-inset-bottom, 0px)); }
    }

    @media (max-width: 560px) {
      .prompts { grid-template-columns: minmax(0, 1fr); gap: 10px; }
      .prompt { padding: 14px 20px; }
      .orb-lg { --s: 88px; }
      .msg { max-width: 92%; padding: 12px 16px; }
      .bar { padding-left: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">

    <!-- Mobile menu toggle -->
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="scrim" id="scrim"></div>

    <!-- Sidebar -->
    <aside class="sidebar glass" id="sidebar">
      <div class="brand">
        <span class="orb orb-sm" aria-hidden="true"></span>
        <div>
          <h2 class="brand-title">Peace AI</h2>
          <p class="brand-sub">Your focus and mindset companion</p>
        </div>
      </div>

      <div class="status" id="status" data-state="checking" role="status">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">Checking backend…</span>
      </div>

      <button class="new-chat" id="newChat" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        New conversation
      </button>

      <details class="settings">
        <summary>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          <span>Settings</span>
          <svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </summary>
        <div class="settings-body">
          <label for="apiUrl">Backend address</label>
          <input id="apiUrl" type="url" spellcheck="false" autocomplete="off" placeholder="http://127.0.0.1:8000/api/v1/chat">
          <p class="hint">Saved in this browser only.</p>
        </div>
      </details>
    </aside>

    <!-- Main -->
    <main class="main">
      <div class="stage" id="stage">

        <section class="hero" id="hero">
          <span class="orb orb-lg" aria-hidden="true"></span>
          <h1>Breathe. Then begin.</h1>
          <p class="hero-sub">Tell me what’s on your mind. We’ll find your focus together, one small step at a time.</p>

          <div class="prompts">
            <button class="prompt" type="button" data-prompt="I can’t focus. Help me reset in 5 minutes.">I can’t focus. Help me reset in 5 minutes.</button>
            <button class="prompt" type="button" data-prompt="My mind is racing and I can’t switch off.">My mind is racing and I can’t switch off.</button>
            <button class="prompt" type="button" data-prompt="Help me start the thing I keep avoiding.">Help me start the thing I keep avoiding.</button>
            <button class="prompt" type="button" data-prompt="I feel overwhelmed. Where do I begin?">I feel overwhelmed. Where do I begin?</button>
          </div>
        </section>

        <div class="feed" id="feed" aria-live="polite"></div>
      </div>

      <form class="composer" id="composer" autocomplete="off">
        <div class="bar glass">
          <textarea id="input" rows="1" placeholder="What’s on your mind?" aria-label="Message Peace AI" enterkeyhint="send"></textarea>
          <button class="send" id="send" type="submit" aria-label="Send message" disabled>
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
      </form>
    </main>
  </div>

  <script>
    (() => {
      'use strict';

      const DEFAULT_API = 'http://127.0.0.1:8000/api/v1/chat';
      const TIMEOUT_MS = 120000;
      const STORAGE_KEY = 'peaceai.apiUrl';

      const $ = (sel) => document.querySelector(sel);
      const app = $('#app');
      const stage = $('#stage');
      const feed = $('#feed');
      const form = $('#composer');
      const input = $('#input');
      const sendBtn = $('#send');
      const statusPill = $('#status');
      const statusText = $('#statusText');
      const newChatBtn = $('#newChat');
      const apiInput = $('#apiUrl');
      const menuBtn = $('#menuBtn');
      const scrim = $('#scrim');

      let apiUrl = sanitizeUrl(readStore()) || DEFAULT_API;
      let busy = false;
      let controller = null;

      /* ---------- Security: URL Sanitization ---------- */
      function sanitizeUrl(urlStr) {
        if (!urlStr) return null;
        try {
          const parsed = new URL(urlStr);
          if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
            return parsed.href;
          }
        } catch {
          /* invalid URL */
        }
        return null;
      }

      /* ---------- storage ---------- */
      function readStore() {
        try { return localStorage.getItem(STORAGE_KEY); } catch { return null; }
      }
      function writeStore(value) {
        try { localStorage.setItem(STORAGE_KEY, value); } catch { /* ignore */ }
      }

      /* ---------- status pill ---------- */
      const STATUS_LABELS = {
        online: 'Backend connected',
        offline: 'Backend offline',
        checking: 'Checking backend…'
      };
      function setStatus(state) {
        statusPill.dataset.state = state;
        statusText.textContent = STATUS_LABELS[state] || STATUS_LABELS.offline;
      }
      async function probe() {
        setStatus('checking');
        const pingCtrl = new AbortController();
        const timer = setTimeout(() => pingCtrl.abort(), 4000);
        try {
          await fetch(apiUrl, { method: 'GET', signal: pingCtrl.signal });
          setStatus('online');
        } catch {
          setStatus('offline');
        } finally {
          clearTimeout(timer);
        }
      }

      /* ---------- messages ---------- */
      function scrollToEnd() {
        // Adding a slight delay ensures DOM updates finish before scrolling
        setTimeout(() => {
          stage.scrollTo({ top: stage.scrollHeight, behavior: 'smooth' });
        }, 50);
      }

      // Basic Markdown parser for better formatting in AI responses
      function parseMarkdown(text) {
        let html = text
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') // Bold
          .replace(/### (.*?)\n/g, '<h3>$1</h3>') // Headers
          .replace(/\n\*(.*?)/g, '<br>• $1') // Lists
          .replace(/\n/g, '<br>'); // Newlines
        return html;
      }

      function addMessage(role, text, { error = false } = {}) {
        const el = document.createElement('div');
        el.className = `msg ${role}${error ? ' error' : ''}`;
        
        if (role === 'bot' && !error) {
          el.innerHTML = parseMarkdown(String(text)); // Safely parse basic markdown for bot
        } else {
          el.textContent = String(text); 
        }

        feed.appendChild(el);
        scrollToEnd();
        return el;
      }

      function addTyping() {
        const el = document.createElement('div');
        el.className = 'msg bot typing';
        el.setAttribute('aria-label', 'Peace AI is typing');
        for (let i = 0; i < 3; i++) {
          el.appendChild(document.createElement('i'));
        }
        feed.appendChild(el);
        scrollToEnd();
        return el;
      }

      function setBusy(value) {
        busy = value;
        updateSendState();
      }

      function updateSendState() {
        sendBtn.disabled = busy || input.value.trim() === '';
      }

      /* ---------- send ---------- */
      async function send(text) {
        const message = text.trim();
        if (!message || busy) return;

        app.classList.add('has-chat');
        addMessage('user', message);
        input.value = '';
        autoGrow();
        setBusy(true);

        const typing = addTyping();
        const currentCtrl = new AbortController();
        controller = currentCtrl;
        const timer = setTimeout(() => currentCtrl.abort(), TIMEOUT_MS);

        try {
          const res = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message }),
            signal: currentCtrl.signal
          });

          if (!res.ok) throw new Error(`HTTP ${res.status}`);

          const data = await res.json();
          typing.remove();
          setStatus('online');

          if (data && data.status === 'success' && typeof data.reply === 'string' && data.reply.trim()) {
            addMessage('bot', data.reply);
          } else {
            addMessage('bot', 'The backend replied, but without a message. Try sending that again.', { error: true });
          }
        } catch (err) {
          typing.remove();
          if (err.name === 'AbortError') {
            if (controller === currentCtrl) {
              addMessage('bot', 'The backend took longer than 2 minutes to respond.', { error: true });
            }
          } else {
            setStatus('offline');
            addMessage('bot', `Can’t reach the backend at ${apiUrl}. Make sure backend is running.`, { error: true });
          }
        } finally {
          clearTimeout(timer);
          if (controller === currentCtrl) controller = null;
          setBusy(false);
          input.focus({ preventScroll: true });
        }
      }

      /* ---------- composer ---------- */
      function autoGrow() {
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 160) + 'px';
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        send(input.value);
      });

      input.addEventListener('input', () => { autoGrow(); updateSendState(); });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          form.requestSubmit();
        }
      });

      document.querySelectorAll('.prompt').forEach((btn) => {
        btn.addEventListener('click', () => send(btn.dataset.prompt || ''));
      });

      /* ---------- new conversation ---------- */
      newChatBtn.addEventListener('click', () => {
        if (controller) {
          const c = controller;
          controller = null;
          c.abort();
        }
        feed.replaceChildren();
        app.classList.remove('has-chat');
        stage.scrollTo({ top: 0 });
        setBusy(false);
        input.focus({ preventScroll: true });
        closeMenu();
      });

      /* ---------- settings ---------- */
      apiInput.value = apiUrl;
      apiInput.addEventListener('change', () => {
        const clean = sanitizeUrl(apiInput.value.trim()) || DEFAULT_API;
        apiUrl = clean;
        apiInput.value = clean;
        writeStore(clean);
        probe();
      });

      /* ---------- mobile drawer ---------- */
      function setMenu(open) {
        app.classList.toggle('menu-open', open);
        menuBtn.setAttribute('aria-expanded', String(open));
      }
      function closeMenu() { setMenu(false); }
      menuBtn.addEventListener('click', () => setMenu(!app.classList.contains('menu-open')));
      scrim.addEventListener('click', closeMenu);
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });

      /* ---------- init ---------- */
      updateSendState();
      probe();
    })();
  </script>
</body>
</html>
